<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Contribution growth from seed to rainforest</title>
  <desc id="desc">A stylized landscape showing a glowing seed, young trees, a mature grove, and a deep rainforest canopy.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
