      <stop offset=".34" stop-color="#b7d7bb"/>
      <stop offset=".72" stop-color="#456f57"/>
      <stop offset="1" stop-color="#183827"/>
    </linearGradient>
    <radialGradient id="sun" cx=".28" cy=".18" r=".34">
