      <stop offset=".45" stop-color="#f1c86b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f1c86b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
