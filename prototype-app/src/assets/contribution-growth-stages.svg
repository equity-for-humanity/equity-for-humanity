<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12000 760" role="img" aria-labelledby="title desc">
  <title id="title">Contribution growth stages from seed to rainforest</title>
  <desc id="desc">Ten stylized realistic landscape panels showing contribution growth from a glowing seed through sprout, sapling, olive, maple, sequoia, grove, orchard, forest, and rainforest.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f8e7b0"/><stop offset=".42" stop-color="#c9dcc0"/><stop offset="1" stop-color="#2b563f"/></linearGradient>
    <linearGradient id="forestSky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d7e8bf"/><stop offset=".52" stop-color="#5f8e65"/><stop offset="1" stop-color="#102a1c"/></linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5f7e46"/><stop offset="1" stop-color="#102a1c"/></linearGradient>
    <linearGradient id="bark" x1="0" x2="1"><stop offset="0" stop-color="#9a6138"/><stop offset=".55" stop-color="#5a351f"/><stop offset="1" stop-color="#24140b"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="base"><rect width="1200" height="760" fill="url(#sky)"/><circle cx="230" cy="140" r="170" fill="#ffeeb0" opacity=".55"/><path d="M0 438c120-58 246-68 378-30 132 39 240 34 374-12 162-55 311-34 448 42v322H0z" fill="#315f43" opacity=".55"/><path d="M0 540c160-48 312-52 456-16 138 35 276 28 414-20 118-41 228-40 330 6v250H0z" fill="#1f4a35" opacity=".82"/><rect y="596" width="1200" height="164" fill="url(#ground)"/></g>
    <g id="seed"><ellipse cx="600" cy="638" rx="145" ry="28" fill="#102a1c" opacity=".32"/><path d="M600 600c-24 0-43-11-43-25 0-16 25-28 43-48 18 20 43 32 43 48 0 14-19 25-43 25z" fill="#f2d878" filter="url(#glow)"/></g>
    <g id="sprout"><path d="M594 620c2-80 26-145 72-196" fill="none" stroke="#315a32" stroke-width="17" stroke-linecap="round"/><path d="M668 428c-50-10-91 8-124 56 56 16 102-3 124-56z" fill="#9bc489"/><path d="M680 420c47-18 92-10 134 22-43 36-90 37-134-22z" fill="#6f936a"/></g>
    <g id="olive"><path d="M585 645c22-104 26-196 12-274 42 65 72 155 88 274z" fill="url(#bark)"/><circle cx="565" cy="390" r="104" fill="#8aa857"/><circle cx="675" cy="390" r="118" fill="#5f875c"/><circle cx="620" cy="485" r="130" fill="#446b54"/><circle cx="548" cy="468" r="76" fill="#91b77a" opacity=".9"/></g>
    <g id="maple"><path d="M590 650c24-112 31-220 18-324 42 70 78 178 92 324z" fill="url(#bark)"/><circle cx="535" cy="392" r="108" fill="#c07a3e"/><circle cx="665" cy="382" r="130" fill="#9f5732"/><circle cx="612" cy="500" r="146" fill="#6f936a"/><path d="M500 384l52-96 44 92 78-68-24 104 102-4-84 62 72 72-104-16-22 104-46-94-88 54 40-96-98-28z" fill="#b86f3d" opacity=".88"/></g>
    <g id="sequoia"><path d="M548 658c36-190 61-330 76-420 34 109 59 249 76 420z" fill="url(#bark)"/><path d="M378 520c82-172 160-312 236-420 100 130 178 271 235 420z" fill="#8d4f2f" opacity=".92"/><path d="M424 476c72-132 135-234 190-304 75 82 133 184 173 304z" fill="#315f43" opacity=".92"/><path d="M480 425c54-88 99-155 135-201 51 54 91 122 120 201z" fill="#446b54"/></g>
    <g id="grove"><use href="#olive" x="-250" y="20" transform="scale(.86)"/><use href="#maple" x="290" y="5" transform="scale(.92)"/><use href="#sequoia" x="250" y="0" transform="scale(.9)"/><path d="M0 610c170-62 334-58 493 11 206-68 442-75 707-14v153H0z" fill="#102a1c" opacity=".55"/></g>
    <g id="orchard"><g fill="#8aa857"><circle cx="220" cy="438" r="96"/><circle cx="410" cy="418" r="110"/><circle cx="610" cy="430" r="122"/><circle cx="815" cy="418" r="110"/><circle cx="1000" cy="438" r="96"/></g><g fill="url(#bark)"><rect x="205" y="470" width="34" height="170" rx="16"/><rect x="394" y="464" width="36" height="176" rx="16"/><rect x="593" y="454" width="42" height="186" rx="18"/><rect x="800" y="464" width="36" height="176" rx="16"/><rect x="985" y="470" width="34" height="170" rx="16"/></g><g fill="#f5d07c" opacity=".95"><circle cx="210" cy="430" r="10"/><circle cx="435" cy="398" r="10"/><circle cx="640" cy="430" r="11"/><circle cx="790" cy="402" r="10"/><circle cx="1010" cy="446" r="10"/></g></g>
    <g id="forest"><use href="#base"/><use href="#olive" x="-390" y="18" transform="scale(.82)"/><use href="#maple" x="-120" y="8" transform="scale(.88)"/><use href="#sequoia" x="220" y="-6" transform="scale(.94)"/><use href="#olive" x="520" y="20" transform="scale(.86)"/><circle cx="930" cy="402" r="138" fill="#276844" opacity=".92"/><circle cx="1035" cy="430" r="126" fill="#123822" opacity=".9"/><path d="M0 604c136-42 282-38 438 12 177-58 358-68 544-28 82 18 154 18 218 0v172H0z" fill="#102a1c" opacity=".56"/></g>
    <g id="rainforest"><use href="#base"/><use href="#sequoia" x="-360" y="-10" transform="scale(.96)"/><use href="#olive" x="-30" y="12" transform="scale(.9)"/><use href="#maple" x="245" y="10" transform="scale(.9)"/><use href="#sequoia" x="460" y="-22" transform="scale(1.03)"/><g fill="#1d5637" opacity=".92"><circle cx="168" cy="480" r="142"/><circle cx="382" cy="408" r="166"/><circle cx="642" cy="466" r="186"/><circle cx="890" cy="398" r="176"/><circle cx="1080" cy="480" r="146"/></g><path d="M0 172c160 36 296 32 408-12 154-60 311-50 472 32 76 39 182 41 320 8v112c-140 26-254 18-342-24-123-59-252-62-388-9-126 49-283 49-470 0z" fill="#fffaf0" opacity=".18"/><path d="M0 624c150-68 328-78 535-31 214-74 436-78 665-10v177H0z" fill="#102a1c" opacity=".62"/></g>
  </defs>
  <g transform="translate(0 0)"><use href="#base"/><use href="#seed"/></g>
  <g transform="translate(1200 0)"><use href="#base"/><use href="#seed" x="-230"/><use href="#sprout"/></g>
  <g transform="translate(2400 0)"><use href="#base"/><use href="#sprout" x="-180"/><use href="#sprout" transform="translate(150 10) scale(1.25)"/></g>
  <g transform="translate(3600 0)"><use href="#base"/><use href="#olive"/></g>
  <g transform="translate(4800 0)"><use href="#base"/><use href="#maple"/></g>
  <g transform="translate(6000 0)"><use href="#base"/><use href="#sequoia"/></g>
  <g transform="translate(7200 0)"><use href="#base"/><use href="#grove"/></g>
  <g transform="translate(8400 0)"><use href="#base"/><use href="#orchard"/></g>
  <g transform="translate(9600 0)"><use href="#forest"/></g>
  <g transform="translate(10800 0)"><use href="#rainforest"/></g>
</svg>
