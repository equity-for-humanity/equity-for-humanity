# Cloudflare Pages private-beta app — not the GitHub Pages brochure.
# Pushing this GitHub repo updates index.html / about.html only.
# Do not `wrangler pages deploy` unless a hosted-beta update is explicitly approved.
#
# CORS lists the stable custom domain and stable pages.dev host only.
# Hashed Pages preview URLs and Workers Playground origins are omitted
# until that preview/playground policy is decided.
name = "equity-for-humanity-private-beta"
compatibility_date = "2026-07-08"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "equity-for-humanity-private-beta"
database_id = "5514dd2f-92e1-49d3-b710-403e583bf2de"

[vars]
VITE_E4H_PRIVATE_BETA = "true"
E4H_ALLOWED_ORIGINS = "https://app.equityforhumanity.org,https://equity-for-humanity-private-beta.pages.dev"
# Set E4H_BETA_ACCESS_CODE as a Cloudflare Pages secret, not here.
